server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA: unknown routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable assets (hashed filenames from Vite build)
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache index.html (so the app shell is always fresh)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
