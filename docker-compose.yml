services:
  mongodb:
    image: mongo:7
    container_name: credhub-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - credhub-network

  mongo-setup:
    image: mongo:7
    container_name: credhub-mongo-setup
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    networks:
      - credhub-network
    command:
      - mongosh
      - --host
      - mongodb:27017
      - --quiet
      - --eval
      - >-
        try { rs.status(); print('Replica set already initialized.'); }
        catch(e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] });
          print('Replica set initiated.');
        }

networks:
  credhub-network:
    driver: bridge

volumes:
  mongodb_data:
